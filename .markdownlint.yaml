# markdownlint config for the reviewdog markdownlint CI (issue #585).
#
# Counts below predate a version bump (dependabot PR #725,
# reviewdog/action-markdownlint 0.26.2→0.27.0) that changed the bundled
# markdownlint-cli from 0.41.0 to 0.49.0 (core markdownlint ~0.34.x →
# ~0.41.x). That bump silently activated MD060/MD056 repo-wide (issue #734)
# and drifted the MD013/MD024/MD041/MD033 counts below out of date — they
# were not re-derived under 0.49.0 as part of #734's fix, since re-deriving
# unrelated pre-existing counts was out of that issue's scope. Treat the
# counts below as directional, not exact, until a future pass re-derives
# them. Counts MUST be re-derived under the pinned version, not a newer local
# markdownlint — rule sets differ between versions.
#
# Only rules the repo intentionally and pervasively diverges from are
# disabled; everything else stays at markdownlint defaults. plugins/ (a
# symlink mirror of the repo root) is excluded from the scan.
#
# markdownlint-cli auto-discovers this file at the repo root, so the
# reviewdog action needs no explicit --config flag.

default: true

# 1706 violations — docs (tables, prose, rule text) use long lines by design.
# An 80-column cap would churn nearly every file with no readability gain.
MD013: false

# 88 — spec.md / SKILL.md files repeat section headings (## 작업, ## 검증)
# by template. Duplicate headings are structural here, not a mistake.
MD024: false

# 52 — some docs open with a non-heading line (frontmatter, intro sentence)
# rather than a top-level heading.
MD041: false

# 6 — a few docs use intentional inline HTML (<details>, <br>, alignment).
MD033: false

# MD060 (table-column-style) and MD056 (table-column-count) are intentionally
# NOT listed — both are active in CI as of the #725 action bump and stay at
# markdownlint defaults. Issue #734 realigned every pre-existing table to
# satisfy MD060's per-table "aligned"/"compact" auto-detected style (each
# column padded to its own max content width, using East-Asian-wide-aware
# character width for CJK cells) and fixed 5 genuine MD056 violations (a
# literal, unescaped `|` inside a table cell was being parsed as an extra
# column separator — escape it as `\|` within the cell). Keep new tables
# aligned/valid at authoring time rather than disabling these rules — they
# catch real data-loss bugs (MD056) as well as cosmetic drift (MD060).
