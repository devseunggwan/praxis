name: secret-scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Prevent redundant runs: a newer push to the same ref cancels the in-flight one.
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: scanning only reads the checked-out tree.
permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Full history so gitleaks can scan commits, not just the working tree.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Synthetic test secrets are allowlisted in .gitleaks.toml.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          # Required for pull_request scans: gitleaks-action uses the token to
          # enumerate the PR's commits via the API. Without it the action hard-
          # fails on pull_request events (push events scan locally and pass),
          # so every PR's secret-scan check was red. The auto-provisioned token
          # needs no extra setup and inherits the contents:read perm above.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
