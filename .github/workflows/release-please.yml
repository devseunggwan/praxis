name: release-please

# Fully-automated release (issue #752). release-please watches main; when the
# Conventional Commits since the last release warrant one, it opens/updates a
# "release PR" that bumps VERSION + CHANGELOG.md. Merging that PR tags the
# commit and publishes the GitHub Release.
#
# VERSION is the single source of truth; the per-platform manifests are
# generated from it (scripts/build-plugin-manifests.py) and their version field
# is gated by scripts/check-plugin-manifests.py's VERSION-DRIFT check. The
# release PR bumps those version fields directly via the `extra-files`
# (type: json, jsonpath: $..version) list in release-please-config.json — same
# commit as the VERSION/CHANGELOG bump — so the drift gate passes with no extra
# push. jsonpath-plus + detect-indent (the libs release-please uses) were
# verified to produce byte-identical output to build-plugin-manifests.py, so
# no manifest regeneration/commit step is needed here.
#
# Why a PAT (RELEASE_PLEASE_TOKEN) instead of the default GITHUB_TOKEN:
# GitHub does not start workflow runs for events created by GITHUB_TOKEN, so a
# release PR opened with it would carry NO CI checks. The PAT (fine-grained:
# Contents, Issues, and Pull requests each read+write — Issues is needed because
# release-please labels the release PR via the Issues API) makes the release PR
# run the normal `ci` checks. See CONTRIBUTING.md → Releases for setup.
on:
  push:
    branches: [main]

# release-please needs to write commits/tags/releases, open PRs, and label them
# (the PR label is applied via the Issues API, so issues:write is required — see
# the release-please-action README).
permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Full history + tags: the coverage guard below enumerates
      # `v<last release>..HEAD`, which needs both. Unlike the ci.yml checkouts
      # this one keeps persist-credentials at its default — the guard fetches
      # the release branch the action has just pushed, and this job already
      # holds contents:write, so the persisted token buys no privilege the job
      # lacked.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # Issue #1228. release-please logs `commit could not be parsed:` for a
      # message its parser rejects, then skips that commit — and the run still
      # ends completed/success with "PR ... remained the same". Three commits
      # were dropped from two releases that way, each found only when a human
      # opened the log. This step re-derives from git which commits should have
      # produced a CHANGELOG entry and fails when the pending release PR is
      # missing one, so the skip surfaces as a red run on main instead.
      # It runs after the action so the release branch reflects this push.
      # An absent release branch is a verdict the guard makes itself
      # (publishable commits with no release PR is a failure, nothing
      # publishable is a pass), but a fetch that fails for transport or auth
      # reasons is not — it looks identical from inside the guard, so the run
      # would go red for a network blip. `ls-remote --exit-code` separates the
      # two: exit 2 means the branch is genuinely absent, anything else means
      # we could not look, and then the step fails open with a warning.
      - name: changelog coverage
        env:
          RELEASE_BRANCH: release-please--branches--main
        run: |
          if git ls-remote --exit-code --heads origin "$RELEASE_BRANCH" >/dev/null; then
            git fetch --no-tags origin \
              "+refs/heads/${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}" || {
              echo "warning: cannot fetch $RELEASE_BRANCH; skipping changelog coverage" >&2
              exit 0
            }
          else
            rc=$?
            if [ "$rc" -ne 2 ]; then
              echo "warning: cannot reach origin (git ls-remote exit $rc); skipping" >&2
              exit 0
            fi
          fi
          python3 scripts/check-changelog-coverage.py
