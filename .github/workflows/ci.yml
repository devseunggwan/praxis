name: ci

# Single consolidated CI workflow (issue #590). Triggers are unified to
# push-on-main + pull_request so a feature-branch push with an open PR runs
# each check once (the prior per-tool workflows used push:["**"] and double-ran
# on every PR). codeql stays in its own file — its weekly schedule and
# security-events:write scope don't belong on the shared trigger.
on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

# A newer push to the same ref cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege default: jobs only read the checked-out code. The reviewdog
# jobs widen to pull-requests:write at the job level. No job pushes back to the
# repo, so every checkout sets persist-credentials: false — the GITHUB_TOKEN is
# not left in .git/config for later steps (pip/apt/run-tests.sh) to reach.
permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
          # No dependency manifest; hash this workflow (which pins ruff) for a
          # stable pip-cache key.
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml
      # Pinned so a future Ruff release can't widen rules and turn CI red
      # without an explicit bump. Matches ruff.toml's rule selection.
      - run: python3 -m pip install "ruff==0.15.8"
      - run: ruff check .

  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned upstream binary (version + sha256), not apt: apt resolves an
      # unpinned 0.9.0 while the zero-excludes runtime pass was verified on
      # 0.11.0, and a silent version bump must not widen rules — same reasoning
      # as the ruff pin. The script installs the same version for the `test`
      # job, so the two blocking shellcheck runs cannot disagree.
      - run: bash scripts/ci-shellcheck.sh
      # File discovery is delegated to scripts/shellcheck-files.sh (see its
      # header for the enumeration rules; it also covers the extensionless
      # skills/ CLI scripts, #1175)
      # and shared verbatim with scripts/run-tests.sh step 9 so the two file
      # sets cannot drift. Two invocations: runtime code gets no rule
      # exclusions; tests/ excludes SC2154/SC2034, the test-harness-only false
      # positives that used to be disabled repo-wide via .shellcheckrc (see its
      # comments). Both invocations always run — a runtime failure must not
      # short-circuit the tests pass, matching run-tests.sh step 9.
      - run: |
          set -o pipefail
          rc=0
          bash scripts/shellcheck-files.sh runtime \
            | xargs -0 shellcheck --severity=warning || rc=1
          bash scripts/shellcheck-files.sh tests \
            | xargs -0 shellcheck --severity=warning --exclude=SC2154,SC2034 || rc=1
          exit "$rc"

  # Trigger moved from push:["**"] to push:[main]+PR, so pre-PR pushes to a
  # feature branch are intentionally unscanned. Coverage for anything that
  # reaches main is unchanged: the PR event scans it, and the post-merge
  # push:[main] re-scans full history (fetch-depth:0) — no secret lands on
  # main unscanned, it's just scanned at PR time instead of first-push time.
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Full history so gitleaks scans commits, not just the working tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Synthetic test secrets are allowlisted in .gitleaks.toml.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          # Required for pull_request scans: the action enumerates the PR's
          # commits via the API. push events scan locally without it.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml
      # ruff is pinned to the same version as the `ruff` job so the local-parity
      # step cannot disagree with the blocking one. PyYAML is what
      # scripts/check-workflow-pins.py parses workflows with; pinned for the
      # same reason, since a parser change moves what the canary can see.
      - run: python3 -m pip install pytest "ruff==0.15.8" "PyYAML==6.0.3"
      # zsh is not preinstalled on ubuntu-24.04. block-unmatched-glob delegates
      # its verdict to a real zsh, so without it that hook's suite has nothing to
      # assert against and silently degrades to fail-open coverage.
      # jq is deliberately NOT installed: the ubuntu-24.04 runner image already
      # ships it at the version noble's apt would resolve anyway (jq 1.7.1), so
      # fetching it only widens the exposure to the mirror stall below.
      # markdownlint-cli2 still comes from npm for the same reason ruff is
      # pinned: under PRAXIS_TESTS_STRICT its absence would abort the run (#917).
      # The phase bound and the retry around it both live in scripts/ci-apt.sh,
      # which carries the reasoning (#1046 bounded the stall, #1049 made it
      # survivable). A stalled mirror was observed killing this step three times
      # before the bound, and again after it -- bounding made the failure fast,
      # the retry is what can make it pass.
      - run: bash scripts/ci-apt.sh zsh
      # shellcheck is no longer taken from the runner image (0.9.0): step 10 of
      # run-tests.sh must run the same pinned version as the `shellcheck` job,
      # so the local-parity step cannot disagree with the blocking one (the ruff
      # pin above exists for the same reason).
      - run: bash scripts/ci-shellcheck.sh
      # Pinned for the same reason ruff is: an unpinned install floats to the
      # newest release, so a markdownlint-cli2 release could change lint
      # behavior (or break install) without an explicit bump (issue #1171).
      # scripts/run-tests.sh's markdownlint step documents the same version
      # for local parity. Bump both together.
      - run: npm install -g markdownlint-cli2@0.23.2
      # Strict: in CI the toolchain is installed, so a SKIPPED line means the
      # run silently stopped checking something rather than accommodating a
      # contributor's machine. markdownlint stays advisory — strict gates on a
      # step being skipped, not on its findings.
      - run: bash scripts/run-tests.sh
        env:
          PRAXIS_TESTS_STRICT: "1"

  link-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # --offline: only validate local file-path links and in-document
      # fragments. External URLs (mostly github.com) are skipped to avoid
      # unauthenticated 429 false failures. --exclude-path '^plugins/': those
      # dirs are symlinks back into the repo root and would re-scan every doc
      # under a plugins/ path where relative links resolve wrong.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --no-progress
            --offline
            --exclude-path '^plugins/'
            --include-fragments
            './**/*.md'
          fail: true

  # reviewdog posts inline review comments, which only works in PR context —
  # so the two reviewdog jobs are gated to pull_request and skip on push:main.
  actionlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned to the latest release; existing workflows pass actionlint
      # cleanly, so error-level gating starts from green.
      - uses: reviewdog/action-actionlint@dbe5299849118fd6f099ba563d263d770955a64a # v1.73.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          # Workflow YAML errors are real bugs, not style — gate at error.
          fail_level: error

  markdownlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Rule config lives in .markdownlint.yaml (counts derived under the
      # version this action bundles — see that file's header).
      - uses: reviewdog/action-markdownlint@6f0e0e8703a9e840ffefa37a2775832c51c1c640 # v0.28.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          # Only flag lines the PR changed; the repo's large existing backlog
          # stays untouched.
          filter_mode: added
          # Advisory rollout: warnings only, never fails the check.
          level: warning
          fail_level: none
