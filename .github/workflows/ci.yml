name: ci

# Single consolidated CI workflow (issue #590). Triggers are unified to
# push-on-main + pull_request so a feature-branch push with an open PR runs
# each check once (the prior per-tool workflows used push:["**"] and double-ran
# on every PR). codeql stays in its own file — its weekly schedule and
# security-events:write scope don't belong on the shared trigger.
on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

# A newer push to the same ref cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege default: jobs only read the checked-out code. The reviewdog
# jobs widen to pull-requests:write at the job level. No job pushes back to the
# repo, so every checkout sets persist-credentials: false — the GITHUB_TOKEN is
# not left in .git/config for later steps (pip/apt/run-tests.sh) to reach.
permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
          # No dependency manifest; hash this workflow (which pins ruff) for a
          # stable pip-cache key.
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml
      # Pinned so a future Ruff release can't widen rules and turn CI red
      # without an explicit bump. Matches ruff.toml's rule selection.
      - run: python3 -m pip install "ruff==0.15.8"
      - run: ruff check .

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ubuntu-latest ships shellcheck, but install explicitly so the job
      # doesn't silently depend on the runner image. Rules come from
      # .shellcheckrc at the repo root.
      # Same phase bound as the test job's apt call (#1045): this job carried the
      # identical unguarded exposure and its own 10-minute budget to lose. The
      # explicit install stays -- the comment above states why the job refuses to
      # depend on the image implicitly, and that reason is unchanged.
      - run: |
          sudo timeout 300 apt-get -o Acquire::Retries=3 \
                       -o Acquire::http::Timeout=20 \
                       -o Acquire::https::Timeout=20 update -y
          sudo timeout 300 apt-get -o Acquire::Retries=3 \
                       -o Acquire::http::Timeout=20 \
                       -o Acquire::https::Timeout=20 install -y shellcheck
      - run: |
          find . -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 shellcheck --severity=warning

  # Trigger moved from push:["**"] to push:[main]+PR, so pre-PR pushes to a
  # feature branch are intentionally unscanned. Coverage for anything that
  # reaches main is unchanged: the PR event scans it, and the post-merge
  # push:[main] re-scans full history (fetch-depth:0) — no secret lands on
  # main unscanned, it's just scanned at PR time instead of first-push time.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history so gitleaks scans commits, not just the working tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Synthetic test secrets are allowlisted in .gitleaks.toml.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          # Required for pull_request scans: the action enumerates the PR's
          # commits via the API. push events scan locally without it.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml
      # ruff is pinned to the same version as the `ruff` job so the local-parity
      # step cannot disagree with the blocking one.
      - run: python3 -m pip install pytest "ruff==0.15.8"
      # zsh is not preinstalled on ubuntu-latest. block-unmatched-glob delegates
      # its verdict to a real zsh, so without it that hook's suite has nothing to
      # assert against and silently degrades to fail-open coverage.
      # jq and shellcheck are deliberately NOT installed: the ubuntu-24.04 runner
      # image already ships both at the versions noble's apt would resolve anyway
      # (jq 1.7.1, shellcheck 0.9.0), so fetching them only widens the exposure to
      # the mirror stall below. markdownlint-cli2 still comes from npm for the
      # same reason ruff is pinned: under PRAXIS_TESTS_STRICT its absence would
      # abort the run (#917).
      # The Acquire timeouts are load-bearing (#1045). Without them apt waits
      # indefinitely on a mirror that stops responding mid-fetch, which consumed
      # the entire 15-minute job budget three times over two days. Retries alone
      # do not help -- a hang never reaches the retry. Timeout covers the data
      # transfer, not just connect, which is where the stall actually happened.
      # Acquire::* bounds each transfer, never the phase: N stalled files still
      # cost N * 20s, and Retries multiplies that. `timeout` bounds the phase, so
      # a bad mirror leaves the budget for npm and the suite. sudo wraps timeout
      # rather than the reverse -- TERM must reach apt, not a sudo that ignores it.
      - run: |
          sudo timeout 300 apt-get -o Acquire::Retries=3 \
                       -o Acquire::http::Timeout=20 \
                       -o Acquire::https::Timeout=20 update -y
          sudo timeout 300 apt-get -o Acquire::Retries=3 \
                       -o Acquire::http::Timeout=20 \
                       -o Acquire::https::Timeout=20 install -y zsh
      - run: npm install -g markdownlint-cli2
      # Strict: in CI the toolchain is installed, so a SKIPPED line means the
      # run silently stopped checking something rather than accommodating a
      # contributor's machine. markdownlint stays advisory — strict gates on a
      # step being skipped, not on its findings.
      - run: bash scripts/run-tests.sh
        env:
          PRAXIS_TESTS_STRICT: "1"

  link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # --offline: only validate local file-path links and in-document
      # fragments. External URLs (mostly github.com) are skipped to avoid
      # unauthenticated 429 false failures. --exclude-path '^plugins/': those
      # dirs are symlinks back into the repo root and would re-scan every doc
      # under a plugins/ path where relative links resolve wrong.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --no-progress
            --offline
            --exclude-path '^plugins/'
            --include-fragments
            './**/*.md'
          fail: true

  # reviewdog posts inline review comments, which only works in PR context —
  # so the two reviewdog jobs are gated to pull_request and skip on push:main.
  actionlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned to the latest release; existing workflows pass actionlint
      # cleanly, so error-level gating starts from green.
      - uses: reviewdog/action-actionlint@d63ba7532e0942965320cd8d73cbae4c7b3c5283 # v1.73.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          # Workflow YAML errors are real bugs, not style — gate at error.
          fail_level: error

  markdownlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Rule config lives in .markdownlint.yaml (counts derived under the
      # version this action bundles — see that file's header).
      - uses: reviewdog/action-markdownlint@6f0e0e8703a9e840ffefa37a2775832c51c1c640 # v0.28.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          # Only flag lines the PR changed; the repo's large existing backlog
          # stays untouched.
          filter_mode: added
          # Advisory rollout: warnings only, never fails the check.
          level: warning
          fail_level: none
